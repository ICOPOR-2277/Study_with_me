name: study_with_me
description: App Study With Me - estudio en grupo (Flutter + FastAPI + PostgreSQL).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0 # cliente HTTP para hablar con la API
  shared_preferences: ^2.2.0 # guarda el token para no pedir login cada vez

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true